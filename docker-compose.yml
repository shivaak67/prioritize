services:
  db:
    image: postgres:16
    container_name: prioritize-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prioritize}
      POSTGRES_USER: ${POSTGRES_USER:-prioritize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - prioritize_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prioritize} -d ${POSTGRES_DB:-prioritize}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: prioritize-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-prioritize}
      POSTGRES_USER: ${POSTGRES_USER:-prioritize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-secret}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:4200}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_OAUTH_SUCCESS_REDIRECT: ${APP_OAUTH_SUCCESS_REDIRECT:-http://localhost:4200/auth/callback}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_WARMUP_ENABLED: ${AI_WARMUP_ENABLED:-true}
      AI_KEEP_ALIVE: ${AI_KEEP_ALIVE:-30m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    build: ./frontend
    container_name: prioritize-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-4200}:80"

volumes:
  prioritize_pgdata:
