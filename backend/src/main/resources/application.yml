spring:
  application:
    name: prioritize-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope:
              - openid
              - profile
              - email

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-to-a-long-random-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
  oauth:
    success-redirect: ${APP_OAUTH_SUCCESS_REDIRECT:http://localhost:4200/auth/callback}
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    warmup-enabled: ${AI_WARMUP_ENABLED:true}
    keep-alive: ${AI_KEEP_ALIVE:30m}
  notifications:
    email:
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
      from: ${NOTIFICATIONS_EMAIL_FROM:noreply@prioritize.app}
    sms:
      enabled: ${NOTIFICATIONS_SMS_ENABLED:false}
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
