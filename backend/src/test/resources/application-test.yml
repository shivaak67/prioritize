spring:
  datasource:
    url: jdbc:h2:mem:prioritize;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  mail:
    host: localhost
    port: 1025

app:
  cors:
    origins: http://localhost:4200
  jwt:
    secret: test-jwt-secret-key-at-least-32-chars-long
    expiration-ms: 900000
  refresh-token:
    expiration-days: 30
    cookie-secure: false
  oauth:
    google:
      enabled: false
  notifications:
    email:
      enabled: false
    sms:
      enabled: false
