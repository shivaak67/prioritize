# Production stack for a single EC2 host (free-tier friendly).
# Only port 80 is exposed; nginx proxies /api and OAuth to the backend.
services:
  db:
    image: postgres:16
    container_name: prioritize-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prioritize}
      POSTGRES_USER: ${POSTGRES_USER:-prioritize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - /opt/prioritize-data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prioritize} -d ${POSTGRES_DB:-prioritize}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: ghcr.io/shivaak67/courseflow-backend:latest
    build: ./backend
    container_name: prioritize-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-prioritize}
      POSTGRES_USER: ${POSTGRES_USER:-prioritize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      APP_OAUTH_SUCCESS_REDIRECT: ${APP_OAUTH_SUCCESS_REDIRECT:-http://localhost/auth/callback}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE:-true}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_WARMUP_ENABLED: ${AI_WARMUP_ENABLED:-false}
      AI_KEEP_ALIVE: ${AI_KEEP_ALIVE:-30m}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-false}
      NOTIFICATIONS_SMS_ENABLED: ${NOTIFICATIONS_SMS_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      SPRING_APPLICATION_JSON: '{"management":{"health":{"mail":{"enabled":false}}}}'
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx256m -XX:+UseSerialGC}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  frontend:
    image: ghcr.io/shivaak67/courseflow-frontend:latest
    build:
      context: ./frontend
      args:
        API_BASE_URL: ""
        NGINX_CONF: nginx.prod.conf
    container_name: prioritize-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
